name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Studio
        uses: actions/checkout@v4

      # Ghost is built from source rather than downloaded: there is no release
      # artifact to pin, and building it takes seconds.
      - name: Check out Ghost
        uses: actions/checkout@v4
        with:
          repository: ghost-language/ghost
          ref: '1.0'
          path: .ghost

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: .ghost/go.sum

      - name: Build Ghost
        run: |
          cd .ghost
          go build -o "$HOME/.local/bin/ghost" ./cmd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The engine-independent half of the toolkit. Exits non-zero on a failed
      # assertion, so a broken build cannot go green.
      - name: Tests
        run: ghost test.gs

      # The three mistakes that have actually shipped here, each of which lived
      # in a file the test suite cannot execute because it imports `lumen:`.
      - name: Lint
        run: python3 tools/lint.py

      # The PNGs under resources/ are build output: tools/make-icons.py holds
      # the art as ASCII so that changing an icon is a readable diff rather
      # than a binary blob nobody can review. That claim is only true while the
      # two agree, so regenerate them and fail on any difference - a hand-edited
      # PNG would otherwise silently become the real source and the ASCII a
      # decorative lie.
      - name: Icon art regenerates byte for byte
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/make-icons.py
          git diff --exit-code -- resources/

      # Every source file has to at least parse. `ghost <file>` reports a syntax
      # fault before it evaluates anything, so a file that only fails on a
      # `lumen:` import is fine - a file that fails to parse is not.
      - name: Parse every source file
        run: |
          status=0
          for file in $(find . -name '*.gs' -not -path './.ghost/*'); do
            if ghost "$file" 2>&1 | grep -q 'syntax error'; then
              echo "syntax error in $file"
              ghost "$file" 2>&1 | head -8
              status=1
            fi
          done
          exit $status

  # Everything above runs without a window and so cannot see a pixel. This job
  # renders the interface for real and holds it against regions cropped from
  # Picotron's own screenshots. It is the only check here that can tell a
  # chamfer of two from a chamfer of three.
  pixels:
    name: Pixel match
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Studio
        uses: actions/checkout@v4

      - name: Check out Lumen
        uses: actions/checkout@v4
        with:
          repository: ghost-language/lumen
          ref: nightly
          path: .lumen

      # Lumen's go.mod replaces ghostlang.org/x/ghost with a sibling checkout,
      # because it tracks Ghost ahead of the published tag. The path is
      # relative to .lumen, so the clone has to sit beside it.
      - name: Check out Ghost
        uses: actions/checkout@v4
        with:
          repository: ghost-language/ghost
          path: ghost

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: .lumen/go.sum

      - name: Install SDL2 and a virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev \
            xvfb python3-pil

      - name: Build Lumen
        run: |
          cd .lumen
          go build -o "$HOME/.local/bin/lumen" ./cmd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Renders verify.gs through Xvfb, reads the framebuffer back, and
      # compares every tile in palette space. Exits non-zero on any mismatch.
      - name: Verify against the Picotron references
        run: tools/verify.sh
